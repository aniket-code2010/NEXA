workflows:
  android-build:
    name: NEXA Android Build
    max_build_duration: 60

    environment:
      flutter: 3.35.7
      groups:
        - supabase
      vars:
        PACKAGE_NAME: "com.nexa.app"

    scripts:
      - name: Generate Android project
        script: |
          flutter create \
            --platforms=android \
            --org com.nexa \
            --project-name nexa \
            .

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build NEXA APK
        script: |
          flutter build apk \
            --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
