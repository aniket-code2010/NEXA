workflows:
  android-build:
    name: NEXA Android Build
    max_build_duration: 60
    environment:
      flutter: 3.35.7
      groups:
        - supabase
      vars:
        PACKAGE_NAME: "com.nexa.app"
    scripts:
      - name: Generate Android project
        script: |
          flutter create --platforms=android --org com.nexa --project-name nexa .
      - name: Ensure Android Internet permission
        script: |
          FILE="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$FILE"; then
            sed -i.bak 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\\n    <application#' "$FILE"
          fi
          grep 'android.permission.INTERNET' "$FILE"
      - name: Verify Supabase configuration
        script: |
          test -n "$SUPABASE_URL" || (echo "ERROR: SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "ERROR: SUPABASE_ANON_KEY is missing" && exit 1)
          echo "Supabase configuration detected."
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze Flutter code
        script: flutter analyze --no-pub
      - name: Build NEXA APK
        script: |
          flutter build apk --release \\
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \\
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
