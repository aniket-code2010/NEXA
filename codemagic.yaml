
workflows:
  nexa-android:
    name: NEXA Android Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Check Flutter installation
        script: |
          flutter --version
          dart --version

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Verify launcher icon
        script: |
          test -f assets/icon/nexa_icon.png

      - name: Generate NEXA launcher icon
        script: |
          dart run flutter_launcher_icons

      - name: Analyze Flutter code
        script: |
          flutter analyze

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
